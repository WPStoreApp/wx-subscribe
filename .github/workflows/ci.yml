name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

  headers:
    name: Plugin headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin header and readme.txt
        run: |
          set -euo pipefail
          mains=$(grep -rl --include='*.php' 'Plugin Name:' . | grep -vE '^./(vendor|tests|\.git)/' || true)
          if [ -z "$mains" ]; then
            echo "No plugin header (Plugin Name) found"
            exit 1
          fi
          echo "Plugin files:"
          echo "$mains"
          main=$(printf '%s\n' "$mains" | head -1)
          grep -E 'Plugin Name:' "$main"
          grep -E 'Version:' "$main"
          test -f readme.txt
          grep -Ei '^Stable tag:' readme.txt
          grep -Ei '^Tested up to:' readme.txt
          echo "Plugin headers OK"

  phpunit:
    name: PHPUnit (PHP 8.3, WP latest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress/
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, gd
          coverage: none
          tools: composer
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion default-mysql-client
      - name: Install Composer dev dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping --host=127.0.0.1 --port=3306 --protocol=tcp --user=root --password=root --silent; then
              echo "MySQL is up"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest true
      - name: Run PHPUnit
        env:
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
        run: vendor/bin/phpunit --configuration phpunit.xml.dist
